<template x-if="tab==='deep'"><section class="grid xl:grid-cols-[300px_minmax(0,1fr)] gap-5 items-start">
<aside class="card p-5 space-y-5 min-w-0">
  <div><p class="eyebrow mb-2">Phase 04 / Neural networks</p><h2 class="font-semibold">Deep learning</h2><p class="text-xs text-slate-500 mt-2">Build a network, follow each epoch, and keep the best validation checkpoint.</p></div>
  <div class="field"><label for="deep-architecture">Architecture</label><select id="deep-architecture" x-model="deepOptions.architecture"><option value="mlp">MLP / ANN</option><option value="cnn">CNN · image classification</option><option value="rnn">RNN · sequence prediction</option><option value="lstm">LSTM · sequence prediction</option><option value="gru">GRU · sequence prediction</option><option value="autoencoder">Autoencoder</option></select></div>
  <div x-show="deepOptions.architecture==='cnn'" class="space-y-3">
    <p class="text-xs text-slate-500">Use class_name/image.jpg folders, optionally inside one parent folder. Upload 12–2,000 images, with at least six distinct images per class. Images are resized to RGB 64×64.</p>
    <label class="block">Image ZIP<input aria-label="Image ZIP archive" type="file" accept=".zip" @change="imageArchive=$event.target.files[0];imageFiles=[]"></label>
    <label class="block">Or choose a folder<input aria-label="Image class folders" type="file" webkitdirectory multiple @change="imageFiles=Array.from($event.target.files);imageArchive=null"></label>
    <button class="btn w-full" @click="uploadImages" :disabled="busy || (!imageArchive&&!imageFiles.length)">Validate image collection</button>
    <div class="field"><label for="deep-image-set">Image collection</label><select id="deep-image-set" x-model="deepOptions.image_id"><option value="">Choose validated images</option><template x-for="collection in imageSets" :key="collection.id"><option :value="collection.id" x-text="collection.result.name+' · '+collection.result.images+' images / '+collection.result.classes.length+' classes'"></option></template></select></div>
    <div class="field"><label for="deep-channels">Convolution channels per layer</label><input id="deep-channels" x-model="deepChannels" placeholder="16,32"><p class="text-[10px] text-slate-400">1–4 convolution blocks, each with 4–128 channels and max pooling.</p></div>
  </div>
  <div x-show="deepOptions.architecture!=='cnn'" class="space-y-4">
    <p class="text-xs text-amber-700" x-show="!dataset">Import a tabular dataset first, or select CNN to upload images.</p>
    <div class="field" x-show="deepSupervised()"><label for="deep-task">Prediction task</label><select id="deep-task" x-model="deepOptions.task"><option value="regression">Regression</option><option value="classification">Classification</option></select></div>
    <div class="field" x-show="deepSupervised()"><label for="deep-target">Neural target</label><select id="deep-target" x-model="deepOptions.target" @change="deepOptions.features=deepOptions.features.filter(c=>c!==deepOptions.target)"><option value="">Choose target</option><template x-for="c in columns" :key="c.name"><option :value="c.name" x-text="c.name"></option></template></select></div>
    <div><div class="flex justify-between"><label>Numeric features</label><span class="chip" x-text="deepOptions.features.length+' selected'"></span></div><button class="text-xs text-pine my-2" @click="selectDeepFeatures">Select all numeric features</button><div class="max-h-44 overflow-auto border rounded-lg p-2"><template x-for="c in columns" :key="c.name"><label class="flex gap-2 py-1.5" :class="{'opacity-40':!analysisNumeric(c)||(deepSupervised()&&c.name===deepOptions.target)}"><input type="checkbox" :aria-label="'Neural feature '+c.name" :disabled="!analysisNumeric(c)||(deepSupervised()&&c.name===deepOptions.target)" :checked="deepOptions.features.includes(c.name)" @change="toggleDeepFeature(c.name)"><span class="break-all" x-text="c.name"></span></label></template></div><p class="text-[10px] text-slate-500 mt-2">Numeric features only. Median imputation and standardization are fitted on training rows.</p></div>
  </div>
  <div x-show="deepSequence()" class="space-y-3 border-t pt-3"><div class="field"><label for="deep-order">Sequence order</label><select id="deep-order" x-model="deepOptions.order_column"><option value="">Current row order</option><template x-for="c in columns" :key="c.name"><option :value="c.name" x-text="c.name"></option></template></select></div><div class="field"><label for="deep-window">Window length</label><input id="deep-window" type="number" min="2" max="100" x-model.number="deepOptions.sequence_length"></div><div class="grid grid-cols-2 gap-3"><div class="field"><label for="deep-recurrent-layers">Recurrent layers</label><input id="deep-recurrent-layers" type="number" min="1" max="3" x-model.number="deepOptions.recurrent_layers"></div><div class="field"><label for="deep-recurrent-units">Recurrent units</label><input id="deep-recurrent-units" type="number" min="4" max="256" x-model.number="deepOptions.recurrent_units"></div></div><p class="text-[10px] text-slate-500">One continuous series. Each window predicts the next row. Train, validation and test are chronological; windows do not cross split boundaries.</p></div>
  <div x-show="deepOptions.architecture==='autoencoder'" class="space-y-3"><div class="field"><label for="deep-latent">Latent dimensions</label><input id="deep-latent" type="number" min="1" max="32" x-model.number="deepOptions.latent_dim"><p class="text-[10px] text-slate-400">Must be smaller than the selected feature count.</p></div><div class="field"><label for="deep-anomaly">Training error quantile for anomaly flags</label><input id="deep-anomaly" type="number" min=".8" max=".999" step=".001" x-model.number="deepOptions.anomaly_quantile"></div></div>
  <div class="field"><label for="deep-widths">Dense layer units</label><input id="deep-widths" x-model="deepWidths" placeholder="64,32"><p class="text-[10px] text-slate-400">Comma-separated widths for 1–4 hidden layers (4–512 units each).</p></div>
  <div class="grid grid-cols-2 gap-3"><div class="field"><label for="deep-activation">Activation</label><select id="deep-activation" x-model="deepOptions.activation"><option value="relu">ReLU</option><option value="tanh">Tanh</option><option value="gelu">GELU</option></select></div><div class="field"><label for="deep-dropout">Dropout</label><input id="deep-dropout" type="number" min="0" max=".7" step=".05" x-model.number="deepOptions.dropout"></div></div>
  <div class="grid grid-cols-2 gap-3"><div class="field"><label for="deep-optimizer">Optimizer</label><select id="deep-optimizer" x-model="deepOptions.optimizer"><option value="adam">Adam</option><option value="sgd">SGD</option><option value="rmsprop">RMSprop</option></select></div><div class="field"><label for="deep-rate">Learning rate</label><input id="deep-rate" type="number" min=".00001" max=".1" step=".0001" x-model.number="deepOptions.learning_rate"></div></div>
  <div class="grid grid-cols-2 gap-3"><div class="field"><label for="deep-batch">Batch size</label><input id="deep-batch" type="number" min="4" max="256" x-model.number="deepOptions.batch_size"></div><div class="field"><label for="deep-epochs">Epochs</label><input id="deep-epochs" type="number" min="1" max="200" x-model.number="deepOptions.epochs"></div></div>
  <div class="grid grid-cols-2 gap-3"><div class="field"><label for="deep-validation">Validation fraction</label><input id="deep-validation" type="number" min=".1" max=".3" step=".05" x-model.number="deepOptions.validation_size"></div><div class="field"><label for="deep-test">Test fraction</label><input id="deep-test" type="number" min=".1" max=".3" step=".05" x-model.number="deepOptions.test_size"></div></div>
  <label class="flex gap-2 items-center"><input type="checkbox" x-model="deepOptions.early_stopping">Early stopping</label><div class="field" x-show="deepOptions.early_stopping"><label for="deep-patience">Patience (epochs)</label><input id="deep-patience" type="number" min="1" max="30" x-model.number="deepOptions.patience"></div>
  <div class="grid grid-cols-2 gap-3"><div class="field"><label for="deep-device">Training device</label><select id="deep-device" x-model="deepOptions.device"><option value="auto">Auto (CUDA / CPU)</option><option value="cpu">CPU</option><option value="cuda">CUDA required</option></select></div><div class="field"><label for="deep-seed">Seed</label><input id="deep-seed" type="number" min="0" max="2147483647" x-model.number="deepOptions.seed"></div></div>
  <button class="btn-primary w-full" @click="trainDeep" :disabled="busy || (deepOptions.architecture==='cnn'?!deepOptions.image_id:(!dataset||!deepOptions.features.length||(deepSupervised()&&!deepOptions.target)))">Train neural network →</button>
  <p class="text-[10px] text-slate-500">Runs in the background with live epoch updates. Best validation weights are saved automatically. Auto uses CPU when CUDA is unavailable.</p>
</aside>
{% include 'workspace/report.html' %}
</section></template>
