  <div class="space-y-5 min-w-0">
    <div class="card p-4 flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-sm font-semibold" x-text="tab==='models'?'Model runs & predictions':'Analysis reports'"></h2><p class="text-[11px] text-slate-400 mt-1">Saved with their source dataset and revision</p></div><select class="!w-full sm:!w-72" aria-label="Saved analysis report" :value="reportId" @change="loadReport($event.target.value)"><option value="">Choose a saved report</option><template x-for="saved in visibleReports()" :key="saved.id"><option :value="saved.id" x-text="saved.result.title+' · '+(saved.result.dataset_name || 'dataset')+' · r'+saved.result.revision+' · '+new Date(saved.created_at).toLocaleTimeString()"></option></template></select></div>
    <div x-show="reportLoading" class="space-y-3" role="status"><p class="text-xs text-slate-400">Loading saved report…</p><div class="skeleton h-24"></div><div class="skeleton h-72"></div></div>
    <div x-show="!report && !reportLoading" class="card p-10 text-center"><span class="inline-flex w-14 h-14 items-center justify-center rounded-xl bg-emerald-50 text-pine text-2xl">◷</span><h3 class="text-xl font-semibold mt-5" x-text="tab==='models'?'From data to predictions.':'From observations to understanding.'"></h3><p class="text-sm leading-relaxed text-slate-500 mt-3 max-w-md mx-auto" x-text="tab==='models'?'Choose a model and its features to start. Compare held-out metrics, explore clusters, and score new observations with saved models.':'Explore associations, compare groups, or inspect the assumptions behind a regression. Start by choosing your columns on the left.'"></p><div x-show="tab==='statistics'" class="grid sm:grid-cols-3 gap-3 mt-8 text-xs text-slate-500"><div class="rounded-lg bg-paper p-4">Correlation<br><span class="text-[10px] text-slate-400">Methods, matrices & p-values</span></div><div class="rounded-lg bg-paper p-4">Regression<br><span class="text-[10px] text-slate-400">Coefficients & diagnostics</span></div><div class="rounded-lg bg-paper p-4">ANOVA<br><span class="text-[10px] text-slate-400">Group effects & comparisons</span></div></div></div>
    <template x-if="report"><div class="space-y-5" :class="{'opacity-50':reportLoading}">
      <section class="card p-5"><div class="flex flex-wrap gap-3 justify-between items-start"><div><h2 class="text-xl font-semibold" x-text="report.title"></h2><p class="text-xs text-slate-400 mt-2" x-text="report.dataset_name+' · revision '+report.revision+' · '+new Date(report.created_at).toLocaleString()"></p></div><a class="btn !text-xs" :href="'/api/jobs/'+reportId+'/download/'">↓ Download report JSON</a></div>
        <p class="mt-4 rounded-lg bg-amber-50 p-3 text-xs text-amber-800" x-show="report.dataset_id!==dataset.id || report.revision_id!==dataset.revision_id">This report describes an earlier or different dataset revision. Run a new analysis to reflect the active data.</p>
        <p class="text-xs text-slate-500 mt-3 break-words" x-text="'Columns used: '+(report.selection?.used || []).join(', ')"></p>
        <p class="font-mono text-sm bg-slate-50 p-3 rounded-lg mt-4 break-words" x-show="report.formula" x-text="report.formula || ''"></p>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-5" x-show="report.metrics.length"><template x-for="metric in report.metrics" :key="metric.name"><div class="bg-paper rounded-lg p-3"><p class="text-[10px] text-slate-400 uppercase tracking-wide" x-text="metric.name"></p><p class="font-semibold text-lg mt-1" x-text="analysisValue(metric.value)"></p></div></template></div>
      </section>
      <section x-show="report.warnings.length" class="rounded-xl border border-amber-200 bg-amber-50 p-4"><h3 class="text-xs font-semibold text-amber-800 mb-2">Check before interpreting</h3><ul class="list-disc pl-4 space-y-2"><template x-for="(warning,index) in report.warnings" :key="index"><li class="text-xs text-amber-900 leading-relaxed" x-text="warning"></li></template></ul></section>
      <section x-show="report.model_url || report.assignments_url" class="card p-5 space-y-3"><h3 class="font-semibold text-sm">Saved outputs</h3><div class="flex flex-wrap gap-3"><a x-show="report.model_url" :href="report.model_url" class="btn !text-xs">↓ Trained model (.pkl)</a><a x-show="report.assignments_url" :href="report.assignments_url" class="btn !text-xs">↓ Complete output CSV</a></div><p x-show="report.model_url" class="text-[11px] text-slate-500">Includes fitted preprocessing and model metadata. Load only trusted model files, using the recorded package versions.</p></section>
      <template x-if="report.thresholds"><section class="card p-5 space-y-4"><h3 class="font-semibold text-sm">Live classification cutoff</h3><p class="text-xs text-slate-500" x-text="'Positive class: '+report.threshold_classes[1]+' · test-set exploration'"></p><label for="classification-cutoff">Probability cutoff <span class="font-mono" x-text="(thresholdIndex/100).toFixed(2)"></span></label><input id="classification-cutoff" type="range" min="0" max="100" step="1" x-model.number="thresholdIndex"><div class="grid grid-cols-2 sm:grid-cols-4 gap-3"><template x-for="name in ['accuracy','precision','recall','f1']" :key="name"><div class="bg-paper p-3 rounded-lg"><p class="text-[10px] uppercase text-slate-400" x-text="name"></p><p class="font-semibold mt-1" x-text="analysisValue(thresholdMetrics()[name])"></p></div></template></div><table class="w-full text-xs text-left"><thead><tr><th class="p-2">Actual / predicted</th><th class="p-2">Negative</th><th class="p-2">Positive</th></tr></thead><tbody><tr class="border-t"><th class="p-2">Negative</th><td class="p-2" x-text="thresholdMetrics().tn"></td><td class="p-2" x-text="thresholdMetrics().fp"></td></tr><tr class="border-t"><th class="p-2">Positive</th><td class="p-2" x-text="thresholdMetrics().fn"></td><td class="p-2" x-text="thresholdMetrics().tp"></td></tr></tbody></table><p class="text-[10px] text-slate-500">Updates use all held-out observations. The original metrics below/above retain the default decision rule; validate any chosen cutoff on new data.</p></section></template>
      <section x-show="report.can_predict" class="card p-5 space-y-4"><h3 class="font-semibold text-sm">Predict on a new file</h3><p class="text-xs text-slate-500">Upload rows with the same feature names. The trained pipeline handles missing values and unseen categories.</p><input aria-label="Prediction data file" type="file" accept=".csv,.tsv,.txt,.json,.xlsx,.xls,.parquet,.xml,.sql,.db,.sqlite,.sqlite3" @change="predictionFile=$event.target.files[0] || null"><div class="field" x-show="report.thresholds"><label for="prediction-threshold">Prediction probability cutoff</label><input id="prediction-threshold" type="number" min="0" max="1" step=".01" x-model.number="predictionThreshold"></div><details><summary class="text-xs font-semibold cursor-pointer">Prediction parsing options</summary><p class="text-[11px] text-slate-500 mt-3">Optional JSON, e.g. {"delimiter":";"}, {"sheets":["Sheet1"]}, or {"table":"observations"}.</p><textarea aria-label="Prediction parsing options JSON" class="mt-2 font-mono text-xs" x-model="predictionParsing"></textarea></details><button class="btn-primary" @click="scoreUpload" :disabled="busy || !predictionFile">Score uploaded data →</button></section>
      <template x-for="(plot,index) in report.figures" :key="reportId+'-plot-'+index"><section class="card overflow-hidden min-w-0"><div class="px-4 pt-4 flex justify-between gap-3 items-center"><h3 class="text-sm font-semibold" x-text="plot.title"></h3><button class="text-xs text-pine shrink-0" @click="downloadChart(index)">↓ PNG</button></div><div :id="'analysis-chart-'+index" class="min-w-0 w-full" style="min-height:360px"></div></section></template>
      <template x-for="(reportTable,index) in report.tables" :key="reportId+'-table-'+index"><section class="card overflow-hidden min-w-0"><div class="p-4 border-b"><h3 class="font-semibold text-sm" x-text="reportTable.title"></h3></div><div class="overflow-auto max-h-[480px]"><table class="w-full text-xs text-left"><thead class="bg-slate-50 sticky top-0"><tr><template x-for="field in reportTable.columns" :key="field"><th class="px-3 py-3 font-semibold whitespace-nowrap" x-text="field"></th></template></tr></thead><tbody><template x-for="(row,rowIndex) in reportRows(index)" :key="rowIndex"><tr class="border-t border-slate-100"><template x-for="field in reportTable.columns" :key="field"><td class="px-3 py-2.5 align-top min-w-20 max-w-sm break-words" :class="row['Flagged']===true?'text-amber-800':''" x-text="analysisValue(row[field])"></td></template></tr></template></tbody></table><p x-show="!reportTable.rows.length" class="p-5 text-xs text-slate-400">No entries for this report.</p></div><div class="p-3 border-t flex items-center justify-between text-[10px] text-slate-400"><span x-text="reportTable.rows.length+' rows · page '+reportPage(index)+' / '+Math.max(1,Math.ceil(reportTable.rows.length/30))"></span><div class="flex gap-2"><button class="btn !py-1 !px-2" :disabled="reportPage(index)<=1" @click="changeReportPage(index,-1)">←</button><button class="btn !py-1 !px-2" :disabled="reportPage(index)>=Math.ceil(reportTable.rows.length/30)" @click="changeReportPage(index,1)">→</button></div></div></section></template>
      <section x-show="report.notes.length" class="card p-5"><h3 class="font-semibold text-sm mb-3">Methods & interpretation</h3><ul class="list-disc pl-4 space-y-3"><template x-for="(note,index) in report.notes" :key="index"><li class="text-xs text-slate-500 leading-relaxed" x-text="note"></li></template></ul></section>
    </div></template>
  </div>
<template x-if="chartExport"><div class="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4" @keydown.escape.window="chartExport=null" role="dialog" aria-modal="true" aria-label="Save chart PNG">
  <section class="card p-5 w-full max-w-3xl max-h-[90vh] overflow-auto"><div class="flex justify-between items-center gap-4"><h2 class="font-semibold" x-text="chartExport.title"></h2><button class="btn" aria-label="Close chart export" @click="chartExport=null">×</button></div><img class="w-full my-4" :src="chartExport.url" :alt="'PNG preview: '+chartExport.title"><a class="btn-primary inline-flex" :href="chartExport.url" :download="chartExport.name">↓ Save PNG</a></section>
</div></template>
